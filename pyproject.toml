[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["boxes"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "config/*",
]

[tool.coverage.report]
fail_under = 90.0
show_missing = true
precision = 2
